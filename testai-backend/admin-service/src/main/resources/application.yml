spring:
  application:
    name: admin-service

  # ========================================
  # ? Keycloak Resource Server
  # ========================================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/testai}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/testai/protocol/openid-connect/certs}
  web:
    error:
      include-binding-errors: always
      include-message: always

server:
  port: ${SERVER_PORT}:8087

# ========================================
# ? Eureka (Service Discovery)
# ========================================
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    enabled: ${EUREKA_ENABLED:true}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# ========================================
# ?? Actuator (Health checks)
# ========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ========================================
# ? Logging
# ========================================
logging:
  level:
    com.example.adminservice: DEBUG
    org.springframework.security: DEBUG
    org.springframework.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"