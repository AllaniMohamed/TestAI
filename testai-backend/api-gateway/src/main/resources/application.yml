# ==========================================
# application.yml - API Gateway
# Configuration complète avec toutes les routes
# ==========================================

server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      # Configuration globale CORS
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      
      # Configuration des routes
      routes:
        # ==========================================
        # USER-SERVICE ROUTES
        # ==========================================
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/users/(?<segment>.*), /api/users/$\{segment}
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
                statusCodes:
                  - 500
        
        # ==========================================
        # PROJECT-SERVICE ROUTES
        # ==========================================
        - id: project-service
          uri: lb://PROJECT-SERVICE
          predicates:
            - Path=/api/projects/**
          filters:
            - RewritePath=/api/projects/(?<segment>.*), /api/projects/$\{segment}
            - name: CircuitBreaker
              args:
                name: projectServiceCB
                fallbackUri: forward:/fallback/project-service
                statusCodes:
                  - 500

        # ==========================================
        # ENDPOINT-SERVICE ROUTES
        # ==========================================
        - id: endpoint-service
          uri: lb://ENDPOINT-SERVICE
          predicates:
            - Path=/api/endpoints/**
          filters:
            - RewritePath=/api/endpoints/(?<segment>.*), /api/endpoints/$\{segment}
            - name: CircuitBreaker
              args:
                name: endpointServiceCB
                fallbackUri: forward:/fallback/endpoint-service
                statusCodes:
                  - 500

        # ==========================================
        # AUTH ROUTES (via user-service)
        # ==========================================
        - id: auth-routes
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /api/auth/$\{segment}
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/auth-service
                statusCodes:
                  - 500

        # ==========================================
        # TEST-SERVICE ROUTES
        # ==========================================
        - id: test-service
          uri: lb://TEST-SERVICE
          predicates:
            - Path=/api/tests/**
          filters:
            - RewritePath=/api/tests/(?<segment>.*), /api/tests/$\{segment}
            - name: CircuitBreaker
              args:
                name: testServiceCB
                fallbackUri: forward:/fallback/test-service
                statusCodes:
                  - 500

        # ==========================================
        # AI-SERVICE ROUTES (Flask, no Eureka registration)
        # ==========================================
        - id: ai-service
          uri: http://ai-service:8084
          predicates:
            - Path=/api/ai/**
          filters:
            - RewritePath=/api/ai/(?<segment>.*), /$\{segment}
            - name: CircuitBreaker
              args:
                name: aiServiceCB
                fallbackUri: forward:/fallback/ai-service
                statusCodes:
                  - 500

        # ==========================================
        # EXECUTION-SERVICE ROUTES (Spring Boot, Eureka)
        # ==========================================
        - id: execution-service
          uri: lb://EXECUTION-SERVICE
          predicates:
            - Path=/api/executions/**
          filters:
            - RewritePath=/api/executions/(?<segment>.*), /api/executions/$\{segment}
            - name: CircuitBreaker
              args:
                name: executionServiceCB
                fallbackUri: forward:/fallback/execution-service
                statusCodes:
                  - 500

        # ==========================================
        # ADMIN-SERVICE ROUTES (Spring Boot, Eureka)
        # ==========================================
        - id: admin-service
          uri: lb://ADMIN-SERVICE
          predicates:
            - Path=/api/admin/**
          filters:
            - RewritePath=/api/admin/(?<segment>.*), /api/admin/$\{segment}
            - name: CircuitBreaker
              args:
                name: adminServiceCB
                fallbackUri: forward:/fallback/admin-service
                statusCodes:
                  - 500

        # ==========================================
        # Notification-SERVICE ROUTES (Spring Boot, Eureka)
        # ==========================================
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notification-service/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationServiceCB
                fallbackUri: forward:/fallback/notification-service
                statusCodes:
                  - 500
                  

# Eureka Configuration
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    enabled: ${EUREKA_ENABLED:true}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

resilience4j:
  circuitbreaker:
    instances:
      userServiceCB:
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        sliding-window-size: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      endpointServiceCB:
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        sliding-window-size: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      projectServiceCB:
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        sliding-window-size: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      testServiceCB:
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        sliding-window-size: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      aiServiceCB:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 20
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      executionServiceCB:
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        sliding-window-size: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      adminServiceCB:
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        sliding-window-size: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      notificationServiceCB:
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        sliding-window-size: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

---
# ==========================================
# Profile Docker
# ==========================================

spring:
  config:
    activate:
      on-profile: docker

server:
  port: ${SERVER_PORT:8888}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL}
    enabled: ${EUREKA_ENABLED:true}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO