server:
  port: 9000

spring:
  application:
    name: blog-api

  # H2 Database
  datasource:
    url: jdbc:h2:mem:blogdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs.json
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha