version: '3.8'
services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: testai-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    networks:
      - testai-network
  keycloak-db:
    image: postgres:15-alpine
    container_name: testai-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    networks:
      - testai-network
    eureka-server:
    build: ./eureka-server
    container_name: testai-eureka-server
    ports:
      - "8761:8761"
    networks:
      - testai-network
  api-gateway:
    build: ./api-gateway
    container_name: testai-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://eureka-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/testai
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server
      - keycloak
    networks:
      - testai-network

  


  
  # Microservices
  user-service:
    build: ./user-service
    container_name: testai-user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: user-db
      DB_PORT: 5432
      DB_NAME: user_db
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/testai
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      - user-db
      - keycloak
      - eureka-server
    networks:
      - testai-network
  project-service:
    build: ./project-service
    container_name: testai-project-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: project-db
      DB_PORT: 5432
      DB_NAME: project_db
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/testai
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      - project-db
      - eureka-server
    networks:
      - testai-network

  user-db:
    image: postgres:15-alpine
    container_name: testai-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - testai-network

  project-db:
    image: postgres:15-alpine
    container_name: testai-project-db
    environment:
      POSTGRES_DB: project_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    networks:
      - testai-network

networks:
  testai-network:
    driver: bridge